name: Website static native-migration checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  website-static:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate public pages, accessibility and launch safeguards
        run: node tests/site-native-preview.test.cjs
      - name: Validate website JavaScript syntax
        shell: pwsh
        run: |
          $scripts = Get-ChildItem -Recurse -File | Where-Object { $_.Extension -in '.js', '.cjs' }
          foreach ($script in $scripts) {
            node --check $script.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
