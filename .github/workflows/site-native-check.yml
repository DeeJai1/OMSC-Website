name: Website static native-migration checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  website-static:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate public pages, accessibility and launch safeguards
        run: node tests/site-native-preview.test.cjs
      - name: Validate launch countdown, local time zones and clock changes
        run: node --test tests/launch-countdown.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate stable-only scan reports and package tampering rejection
        run: python -m unittest discover -s tests -p 'test_release_security.py'
      - name: Validate website JavaScript syntax
        shell: pwsh
        run: |
          $scripts = Get-ChildItem -Recurse -File | Where-Object { $_.Extension -in '.js', '.cjs' }
          foreach ($script in $scripts) {
            node --check $script.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
